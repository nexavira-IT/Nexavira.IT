{% if page_obj.has_other_pages %}
  <nav class="panel-pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if status_filter %}status={{ status_filter|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>
    {% else %}
      <span class="is-disabled">← Previous</span>
    {% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if status_filter %}status={{ status_filter|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next →</a>
    {% else %}
      <span class="is-disabled">Next →</span>
    {% endif %}
  </nav>
{% endif %}
